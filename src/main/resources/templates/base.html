<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(Content)">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
  
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"> 
      <link rel="stylesheet" th:href="@{/css/style.css}">
    
    <title th:text="${title}"></title>
  </head>
  <body>
    
    <!-- Navigation Bar -->
    
    <nav class="navbar navbar-expand-lg bg-body-tertiary navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Smart Contact Manager</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0 text-uppercase">
        <li class="nav-item">
          <a class="nav-link active"  th:href="@{/}" aria-current="page" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" th:href="@{/about}" >About</a>
        </li>
       
        
        <li class="nav-item">
          <a class="nav-link " th:href="@{/user/index}" tabindex="-1" aria-disables="true">Login</a>
        </li>
        
        <li class="nav-item">
          <a class="nav-link " th:href="@{/signup}" href="#" tabindex="-1" aria-disables="true">Sign Up</a>
        </li>
      
      	
      
      </ul>
      
    </div>
  </div>
</nav>
    
    <div th:replace="${Content}"></div>

    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmYR+jYFjz+iqe/x5OwYABi6OWs"
        crossorigin="anonymous"></script>
  </body>
</html>
