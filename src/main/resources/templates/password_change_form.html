<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
<section>
		<div class="container mt-5">
			<div class="row justify-content-center">
				<div class="col-md-6">
					<h2 class="mb-4 text-center">Enter New Password</h2>
					<!-- Display error message -->
					<div th:if="${message}" class="alert alert-danger" th:text="${message}"></div>
		
					<form th:action="@{/change-password}" method="post">
						<div class="form-group mb-3">
                            <label for="password" class="mb-2" >Enter New Password</label>
                            <input type="password" class="form-control mb-2" id="password" name="newPassword1" placeholder="Enter new password" required>
                            </div>
                            	<div class="form-group mb-3">
                            <label for="password" class="mb-2" >Confirm New Password</label>
                            <input type="password" class="form-control mb-2" id="password" name="newPassword2" placeholder="Confirm new password" required>
                            </div>
                      <button type="submit" class="btn btn-primary w-100">Change Password</button>
                                                                        </form>
                                                                                        </div>
                                                                                        </div>
                                                                                        </div>


</section>

</body>
</html>
