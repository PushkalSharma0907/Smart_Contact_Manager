<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title></title>
</head>
<body>
<section>
	
    <div class="container">
    	<div class="row">
    		<div class="col-md-8 offset-md-2">
    			<div class="card mt-5">
    				<div class="card-header text-center">
    					<h1>Register Here</h1>
    				</div>
    				<div class="card-body">
    					<form action="" th:action="@{/do_register}" method="post" th:object="${user}">
    					<div th:if="${message}" class="alert alert-success" role="alert" th:text="${message}"></div>

							
    						<div class="mb-3">
    							<label for="username" class="form-label">Your Name</label>
    							<input type="text" class="form-control" id="username" placeholder="Enter here" th:field="*{name}" required>
    							    <p th:each="e : ${#fields.errors('name')}" th:text="${e}" class="text-danger"></p>
    							
    						</div>
    						<div class="mb-3">
    						<label>Email</label>
    <input type="email" th:field="*{email}" class="form-control" placeholder="Enter here">
    <p th:each="e : ${#fields.errors('email')}" th:text="${e}" class="text-danger"></p>
    							
    						</div>
    						<div class="mb-3">
    							<label for="password" class="form-label">Password</label>
    							<input type="password" class="form-control" id="password" placeholder="Enter here" th:field="*{password}" required>
    							    <p th:if="${#fields.errors('password')}" th:errors="*{password}" class="text-danger"></p>
    							
    						</div>
    						
    						<div class="form-group">
    						<textarea placeholder="Enter something yourself " rows="25" class="form-control" th:field="*{about}"></textarea>
    						</div>
    						
    						<div class="form-group from check">
    						<input type="checkbox" name="agreement" class="form-check-input" id="agreement" />
    						<label for="agreement">Accept Terms and Conditions</label>
    						<p th:if="${#fields.hasErrors('enabled')}" th:errors="*{enabled}" class="text-danger"></p>
    						</div>
    						<button type="submit" class="btn btn-primary w-100">Sign Up</button>
    						<button type="reset" class="btn btn-secondary w-100 mt-2">Reset</button>
    					</form>
    				</div>
    			</div>
     
    
  </div>

</section>

</body>
</html>
