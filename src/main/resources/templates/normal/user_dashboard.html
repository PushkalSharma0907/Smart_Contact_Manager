<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="normal/base :: layout(~{::section})">
  <section style="background-color: #ffffff; min-height: 100vh; padding: 40px 0;">
    <div class="container">

      <!-- Title -->
      <div class="text-center mb-3">
        <img th:src="${user.imageUrl == 'default.png' ? '/images/default.png' : user.imageUrl}" alt="Dashboard Icon" class="img-fluid rounded-circle mb-3" style="width: 200px; height: 200px;">
        </div>
      <h2 class="text-center mb-5">
        Welcome, <span th:text="${user.name}">User</span>
      </h2>

      <!-- Total Contacts Block -->
      <div class="p-4 mb-4 rounded shadow text-center" style="background-color: #e3f2fd;">
        <h4>Total Contacts :</h4>
        <h5> <strong th:text="${noOfContact}"></strong></h5>
      </div>

    

      <!-- Quick Actions Block -->
      <div class="p-4 mb-4 rounded shadow text-center" style="background-color: #fff3e0;">
        <h4>Quick Actions</h4>
        <div class="mt-3">
          <a th:href="@{/user/add-contact}" class="btn btn-primary mx-2">Add Contact</a>
          <a th:href="@{/user/show-contacts/0}" class="btn btn-secondary mx-2">View Contacts</a>
          <a th:href="@{/user/profile}" class="btn btn-info mx-2">My Profile</a>
        </div>
      </div>
      
        <!-- Thank You Block -->
      <div class="p-4 mb-4 rounded shadow text-center" style="background-color: #fce4ec;">
        <h4>Thank You</h4>
        <p>Thank you for joining us! We’re excited to have you onboard.</p>
      </div>

    </div>
  </section>
  
  
</html>
