<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{normal/base :: layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>


<body>
<section>
<h1 class="text-center">My Contacts</h1>

<div class="search-container my-3">
  <!-- search input -->
  <input type="text" id="searchInput" class="form-control"
         placeholder="Search contacts..." onkeyup="search()">

  <!-- hidden field for currentPage -->
  <input type="hidden" id="currentPage" value="[[${currentPage}]]">

  <!-- search results dropdown -->
  <div class="search-results"></div>
</div>


	<div class="container mt-4">
		<div class="row">
			<div class="col-md-12 table-responsive">
				<table class="table table-bordered table-striped table-hover">
					<thead class="table-primary">
						<tr>
							
							<th>Name</th>
							<th>Second Name</th>
		
							<th>Email</th>
							<th>Phone</th>
							<th>Action</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="contact : ${contacts}">
							
							<td><img class="my_profile_picture" alt="profile photo" src="" th:src="${contact.image == 'default.png' ? '/images/default.png' : contact.image}"><span  th:text="' '+${contact.name}"></span> </td>
							<td th:text="${contact.secondName}"></td>
							
							<td th:text="${contact.email}"></td>
							<td th:text="${contact.phone}"></td>
							<td >
							
							<a  class="btn btn-danger btn-sm"    th:onclick="|deleteContact(${contact.cid}, ${currentPage})|">Delete</a>
							<a th:href="@{'/user/'+${contact.cid}+'/contact?page='+${currentPage}}" class="btn btn-primary btn-sm ">View</a>
							<a th:href="@{'/user/update-contact/'+${contact.cid}}" class="btn btn-warning btn-sm text-white">Update</a>							
							</td>
						</tr>
					</tbody>
				</table>
				
				<!-- pagination -->
				<nav aria-label="Page navigation example">
  <ul class="pagination">
    <li th:if="${currentPage != 0 }" class="page-item"><a th:href="@{'/user/show-contacts/'+${currentPage-1}}" class="page-link" href="#">Previous</a></li>
    <li th:classappend="${currentPage==i-1?'active':''}" th:each="i : ${#numbers.sequence(1,totalPages)}" class="page-item"><a th:href="@{'/user/show-contacts/'+${i-1}}" class="page-link" href="#"><span th:text="${i}"></span></a></li>
   <li th:if="${currentPage+1 != totalPages }" class="page-item"><a th:href="@{'/user/show-contacts/'+${currentPage+1}}" class="page-link" href="#">Next</a></li>
  </ul>
</nav>
			</div>
		</div>
	</div>

</section>

<script src="/js/jscript.js" defer></script>
</body>
</html>
