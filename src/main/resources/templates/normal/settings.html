<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="normal/base :: layout(~{::section})">
  <head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<section>
	 <div class="form-container">
	 
	     <div th:if="${msg1}" class="alert alert-success" role="alert" th:text="${msg1}"></div>
              <div th:if="${msg2}" class="alert alert-danger " role="alert" th:text="${msg2}" ></div>
    
        <h2 class="mb-3">Change Password</h2>
        <form action="/user/change-password" method="post">
        <div class="form-group mb-2">
          
            <input type="password" id="oldPassword" class="form-control" name="oldPassword" placeholder="Enter old password" required>
		</div>
			
             <div class="form-group mb-2">
          
            <input type="password" id="newPassword" class="form-control" name="newPassword" placeholder="Enter new password" required>
		</div>         
		
<div class="btn-container text-center">
    <button type="submit" class="btn btn-success ">Update Password</button>
    <button type="reset" class="btn btn-warning ">Reset Password</button>
  </div>
        </form>
    </div>

	
	
    <script >
		$(document).ready(function () {
				$(".item").removeClass("active");
				$('#setting-link').addClass('active');
			});
		
		</script>
  </section>
  </body>
  
</html>
