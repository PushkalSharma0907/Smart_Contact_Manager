    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"
            integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8sh+WyFIofl9FhFZxFf5D1z5nQF5D1z5nQF5D1z5nQF5D1z"
            crossorigin="anonymous"></script>
      <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
            
      <script>
      	function deleteContact(cid	, currentPage) {
      		const swalWithBootstrapButtons = Swal.mixin({
      		  customClass: {
      		    confirmButton: "btn btn-success",
      		    cancelButton: "btn btn-danger"
      		  },
      		  buttonsStyling: false
      		});
      		swalWithBootstrapButtons.fire({
      		  title: "Are you sure?",
      		  text: "You won't be able to revert this!",
      		  icon: "warning",
      		  showCancelButton: true,
      		  confirmButtonText: "Yes, delete it!",
      		  cancelButtonText: "No, cancel!",
      		  reverseButtons: true
      		}).then((result) => {
      		  if (result.isConfirmed) {
      		    swalWithBootstrapButtons.fire({
      		      title: "Deleted!",
      		      text: "Your Contact has been deleted.",
      		      icon: "success"}).then(() => {
      		      window.location.href = "/user/" + cid + "/delete?page=" + currentPage
      		    });
      		  } else if (
      		    /* Read more about handling dismissals below */
      		    result.dismiss === Swal.DismissReason.cancel
      		  ) {
      		    swalWithBootstrapButtons.fire({
      		      title: "Cancelled",
      		      text: "Your Contact is safe :)",
      		      icon: "error"
      		    });
      		  }
      		});
      	}
      
      </script>
